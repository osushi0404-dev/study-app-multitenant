name: E2E Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d db backend frontend

      - name: Wait for frontend to be ready
        run: |
          timeout 120 sh -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'

      - name: Wait for backend to be ready
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:8000/api/ > /dev/null 2>&1 || curl -sf http://localhost:8000/ > /dev/null 2>&1; do sleep 3; done'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
