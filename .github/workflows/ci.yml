name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# I182: PR 側のテスト・スクリプトも CI の中で動くので、GITHUB_TOKEN は読み取りだけにする（最小権限）
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pre-commit (Ruff + bandit)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: eslint
      - name: pip-audit
        run: pip-audit -r requirements.txt
        working-directory: backend
      - name: Check migration drift
        # makemigrations --check は DB 接続不要の静的チェック（モデルと migration の乖離を検出）
        # requirements.txt を追加インストールして Django と依存パッケージを揃える
        run: |
          pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run
        working-directory: backend

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: learning_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis: アプリはキャッシュ/セッション/Celery で Redis に依存するため、
      # キャッシュ挙動（イシュー#073 の無効化テスト等）を CI でも検証する。
      # REDIS_URL 既定が redis://localhost:6379/0 のため env 追加は不要。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run pytest
        run: pytest
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: learning_app
          DB_USER: postgres
          DB_PASSWORD: password

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

  frontend-lint:
    name: Frontend Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 -f github-actions
        working-directory: frontend
      - name: npm audit
        run: npm audit --audit-level=critical --omit=dev
        working-directory: frontend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Jest
        run: CI=true npm test
        working-directory: frontend

  # I193（I185 P8）: ハーネス（スキル・スクリプト・見張り）の回帰テストを PR ごとに流す。
  # ユーザーの確認を減らした流れで、ハーネスの退行を GitHub で止めるため。秘密情報は使わない。
  harness-tests:
    name: Harness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 履歴を見るテスト（採番・レビュー記録など）があるため
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure git identity for temporary test repositories
        run: |
          git config --global user.name "harness-tests"
          git config --global user.email "harness-tests@example.invalid"
      - name: Run harness tests
        run: bash scripts/claude/tests/run-all.sh
