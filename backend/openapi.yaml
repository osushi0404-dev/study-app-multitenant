openapi: 3.0.3
info:
  title: study-app API
  version: 1.0.0
paths:
  /api/dashboard/analytics/:
    get:
      operationId: dashboard_analytics_retrieve
      description: 学習統計（期間の推移・科目別の内訳。クイズの答えの記録から数える・I488）
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
      - in: query
        name: subject_id
        schema:
          type: integer
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalytics'
          description: ''
  /api/dashboard/overview/:
    get:
      operationId: dashboard_overview_retrieve
      description: ダッシュボードの数字（クイズの答えの記録から数える・I473）
      parameters:
      - in: query
        name: subject_id
        schema:
          type: integer
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
          description: ''
  /api/settings/:
    get:
      operationId: settings_retrieve
      tags:
      - settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
    put:
      operationId: settings_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
    patch:
      operationId: settings_partial_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
components:
  schemas:
    DashboardAnalytics:
      type: object
      description: GET /api/dashboard/analytics/ の応答（キーは全部必須）
      properties:
        has_data:
          type: boolean
        period:
          $ref: '#/components/schemas/DashboardAnalyticsPeriod'
        totals:
          $ref: '#/components/schemas/DashboardAnalyticsTotals'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAnalyticsBucket'
        subject_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAnalyticsSubject'
      required:
      - has_data
      - period
      - subject_breakdown
      - totals
      - trend
    DashboardAnalyticsBucket:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - end_date
      - start_date
      - study_seconds
    DashboardAnalyticsGranularityEnum:
      enum:
      - day
      - week
      - month
      type: string
      description: |-
        * `day` - day
        * `week` - week
        * `month` - month
    DashboardAnalyticsPeriod:
      type: object
      properties:
        days:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        granularity:
          $ref: '#/components/schemas/DashboardAnalyticsGranularityEnum'
      required:
      - days
      - end_date
      - granularity
      - start_date
    DashboardAnalyticsSubject:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        subject_id:
          type: integer
        subject_name:
          type: string
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - study_seconds
      - subject_id
      - subject_name
    DashboardAnalyticsTotals:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        studied_days:
          type: integer
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - studied_days
      - study_seconds
    DashboardDay:
      type: object
      properties:
        date:
          type: string
          format: date
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
      required:
      - answered_count
      - correct_count
      - date
      - study_seconds
    DashboardOverview:
      type: object
      description: GET /api/dashboard/overview/ の応答（キーは全部必須）
      properties:
        has_data:
          type: boolean
        today:
          $ref: '#/components/schemas/DashboardToday'
        streak:
          $ref: '#/components/schemas/DashboardStreak'
        totals:
          $ref: '#/components/schemas/DashboardTotals'
        last_7_days:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDay'
        weak_subjects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWeakSubject'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRecommendation'
      required:
      - has_data
      - last_7_days
      - recommendations
      - streak
      - today
      - totals
      - weak_subjects
    DashboardRecommendation:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DashboardRecommendationKindEnum'
        subject_id:
          type: integer
        subject_name:
          type: string
        reason:
          type: string
      required:
      - kind
      - reason
      - subject_id
      - subject_name
    DashboardRecommendationKindEnum:
      enum:
      - weak_subject
      - unstudied_subject
      type: string
      description: |-
        * `weak_subject` - weak_subject
        * `unstudied_subject` - unstudied_subject
    DashboardStreak:
      type: object
      properties:
        current_days:
          type: integer
      required:
      - current_days
    DashboardToday:
      type: object
      properties:
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        study_seconds:
          type: integer
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - study_seconds
    DashboardTotals:
      type: object
      properties:
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
      required:
      - accuracy_rate
      - answered_count
      - correct_count
    DashboardWeakSubject:
      type: object
      properties:
        subject_id:
          type: integer
        subject_name:
          type: string
        answered_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
      required:
      - accuracy_rate
      - answered_count
      - subject_id
      - subject_name
    PatchedUserSettings:
      type: object
      properties:
        daily_study_goal_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        study_reminders_enabled:
          type: boolean
        reminder_time:
          type: string
          format: time
        theme_preference:
          $ref: '#/components/schemas/ThemePreferenceEnum'
        notification_settings: {}
    ThemePreferenceEnum:
      enum:
      - light
      - dark
      - auto
      type: string
      description: |-
        * `light` - Light
        * `dark` - Dark
        * `auto` - Auto
    UserSettings:
      type: object
      properties:
        daily_study_goal_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        study_reminders_enabled:
          type: boolean
        reminder_time:
          type: string
          format: time
        theme_preference:
          $ref: '#/components/schemas/ThemePreferenceEnum'
        notification_settings: {}
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
