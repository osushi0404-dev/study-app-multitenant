openapi: 3.0.3
info:
  title: study-app API
  version: 1.0.0
paths:
  /api/auth/passkeys/:
    get:
      operationId: auth_passkeys_list
      description: 本人のパスキーの一覧・名前の変更・削除・登録（他人・別の組織の物は 404）
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - passkeys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPasskeyList'
          description: ''
  /api/auth/passkeys/{id}/:
    patch:
      operationId: auth_passkeys_partial_update
      description: 本人のパスキーの一覧・名前の変更・削除・登録（他人・別の組織の物は 404）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - passkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPasskey'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPasskey'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
          description: ''
    delete:
      operationId: auth_passkeys_destroy
      description: 本人のパスキーの一覧・名前の変更・削除・登録（他人・別の組織の物は 404）
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - passkeys
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/passkeys/login/:
    post:
      operationId: auth_passkeys_login_create
      description: パスキーでのログイン。ログインの前に呼ぶので AllowAny
      tags:
      - passkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/passkeys/login/options/:
    post:
      operationId: auth_passkeys_login_options_create
      description: パスキーでのログインの options。ログインの前に呼ぶので AllowAny
      tags:
      - passkeys
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/auth/passkeys/reauth/:
    post:
      operationId: auth_passkeys_reauth_create
      description: 本人確認（パスワードかパスキー）。通れば 5 分有効の印を返す
      tags:
      - passkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyReauth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasskeyReauth'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthToken'
          description: ''
  /api/auth/passkeys/reauth/options/:
    post:
      operationId: auth_passkeys_reauth_options_create
      description: 本人確認をパスキーで行うときの options（本人のパスキーだけを許す）
      tags:
      - passkeys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/auth/passkeys/register/:
    post:
      operationId: auth_passkeys_register_create
      description: 本人のパスキーの一覧・名前の変更・削除・登録（他人・別の組織の物は 404）
      tags:
      - passkeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnCredential'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
          description: ''
  /api/auth/passkeys/register/options/:
    post:
      operationId: auth_passkeys_register_options_create
      description: 本人のパスキーの一覧・名前の変更・削除・登録（他人・別の組織の物は 404）
      tags:
      - passkeys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
          description: ''
  /api/dashboard/analytics/:
    get:
      operationId: dashboard_analytics_retrieve
      description: 学習統計（期間の推移・科目別の内訳。クイズの答えの記録から数える・I488）
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
      - in: query
        name: subject_id
        schema:
          type: integer
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalytics'
          description: ''
  /api/dashboard/overview/:
    get:
      operationId: dashboard_overview_retrieve
      description: ダッシュボードの数字（クイズの答えの記録から数える・I473）
      parameters:
      - in: query
        name: subject_id
        schema:
          type: integer
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
          description: ''
  /api/settings/:
    get:
      operationId: settings_retrieve
      tags:
      - settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
    put:
      operationId: settings_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
    patch:
      operationId: settings_partial_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          description: ''
  /api/user/subjects/:
    get:
      operationId: user_subjects_list
      description: 利用者が選んだ科目の取得と置き換え（書けるのは本人の分だけ）
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubject'
          description: ''
    put:
      operationId: user_subjects_update
      description: 利用者が選んだ科目の取得と置き換え（書けるのは本人の分だけ）
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSubjectSelection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSubjectSelection'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubject'
          description: ''
  /api/user/subjects/available/:
    get:
      operationId: user_subjects_available_list
      description: 利用者が選べる自組織の科目（名前の順・ページ分けなし。組織に属さない利用者は空）
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSubject'
          description: ''
components:
  schemas:
    AvailableSubject:
      type: object
      description: 利用者が選べる自組織の科目（I494。GET /api/user/subjects/available/ の応答）
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    DashboardAnalytics:
      type: object
      description: GET /api/dashboard/analytics/ の応答（キーは全部必須）
      properties:
        has_data:
          type: boolean
        period:
          $ref: '#/components/schemas/DashboardAnalyticsPeriod'
        totals:
          $ref: '#/components/schemas/DashboardAnalyticsTotals'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAnalyticsBucket'
        subject_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAnalyticsSubject'
      required:
      - has_data
      - period
      - subject_breakdown
      - totals
      - trend
    DashboardAnalyticsBucket:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - end_date
      - start_date
      - study_seconds
    DashboardAnalyticsGranularityEnum:
      enum:
      - day
      - week
      - month
      type: string
      description: |-
        * `day` - day
        * `week` - week
        * `month` - month
    DashboardAnalyticsPeriod:
      type: object
      properties:
        days:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        granularity:
          $ref: '#/components/schemas/DashboardAnalyticsGranularityEnum'
      required:
      - days
      - end_date
      - granularity
      - start_date
    DashboardAnalyticsSubject:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        subject_id:
          type: integer
        subject_name:
          type: string
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - study_seconds
      - subject_id
      - subject_name
    DashboardAnalyticsTotals:
      type: object
      properties:
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        studied_days:
          type: integer
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - studied_days
      - study_seconds
    DashboardDay:
      type: object
      properties:
        date:
          type: string
          format: date
        study_seconds:
          type: integer
        answered_count:
          type: integer
        correct_count:
          type: integer
      required:
      - answered_count
      - correct_count
      - date
      - study_seconds
    DashboardOverview:
      type: object
      description: GET /api/dashboard/overview/ の応答（キーは全部必須）
      properties:
        has_data:
          type: boolean
        today:
          $ref: '#/components/schemas/DashboardToday'
        streak:
          $ref: '#/components/schemas/DashboardStreak'
        totals:
          $ref: '#/components/schemas/DashboardTotals'
        last_7_days:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDay'
        weak_subjects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWeakSubject'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRecommendation'
        weak_difficulties:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWeakDifficulty'
        rushed_mistakes:
          allOf:
          - $ref: '#/components/schemas/DashboardRushedMistakes'
          nullable: true
      required:
      - has_data
      - last_7_days
      - recommendations
      - rushed_mistakes
      - streak
      - today
      - totals
      - weak_difficulties
      - weak_subjects
    DashboardRecommendation:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DashboardRecommendationKindEnum'
        subject_id:
          type: integer
        subject_name:
          type: string
        reason:
          type: string
      required:
      - kind
      - reason
      - subject_id
      - subject_name
    DashboardRecommendationKindEnum:
      enum:
      - weak_subject
      - unstudied_subject
      type: string
      description: |-
        * `weak_subject` - weak_subject
        * `unstudied_subject` - unstudied_subject
    DashboardRushedMistakes:
      type: object
      description: 直近 30 日の間違いのうち、急いで答えたものの数と割合（I466）
      properties:
        mistake_count:
          type: integer
        rushed_count:
          type: integer
        rushed_rate:
          type: number
          format: double
      required:
      - mistake_count
      - rushed_count
      - rushed_rate
    DashboardStreak:
      type: object
      properties:
        current_days:
          type: integer
      required:
      - current_days
    DashboardToday:
      type: object
      properties:
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
        study_seconds:
          type: integer
      required:
      - accuracy_rate
      - answered_count
      - correct_count
      - study_seconds
    DashboardTotals:
      type: object
      properties:
        answered_count:
          type: integer
        correct_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
          nullable: true
      required:
      - accuracy_rate
      - answered_count
      - correct_count
    DashboardWeakDifficulty:
      type: object
      description: 苦手な難易度（I466。値は problems/difficulty.py の文字）
      properties:
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        answered_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
      required:
      - accuracy_rate
      - answered_count
      - difficulty
    DashboardWeakSubject:
      type: object
      properties:
        subject_id:
          type: integer
        subject_name:
          type: string
        answered_count:
          type: integer
        accuracy_rate:
          type: number
          format: double
      required:
      - accuracy_rate
      - answered_count
      - subject_id
      - subject_name
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - easy
        * `medium` - medium
        * `hard` - hard
    LoginResponse:
      type: object
      description: ログインの応答（パスワード・パスキーで同じ形・I619）
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    PaginatedPasskeyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
    Passkey:
      type: object
      description: パスキーの一覧・名前の変更（I619）。鍵・認証器の ID・署名回数は出さない
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - last_used_at
      - name
    PasskeyReauth:
      type: object
      description: '本人確認: パスワードか、パスキー（challenge_id と credential）のちょうど片方（I619）'
      properties:
        password:
          type: string
          writeOnly: true
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: {}
    PatchedPasskey:
      type: object
      description: パスキーの一覧・名前の変更（I619）。鍵・認証器の ID・署名回数は出さない
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedUserSettings:
      type: object
      properties:
        daily_study_goal_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        study_reminders_enabled:
          type: boolean
        reminder_time:
          type: string
          format: time
        theme_preference:
          $ref: '#/components/schemas/ThemePreferenceEnum'
        notification_settings: {}
    ReauthToken:
      type: object
      properties:
        reauth_token:
          type: string
        expires_in:
          type: integer
      required:
      - expires_in
      - reauth_token
    RoleEnum:
      enum:
      - user
      - admin
      type: string
      description: |-
        * `user` - User
        * `admin` - Admin
    ThemePreferenceEnum:
      enum:
      - light
      - dark
      - auto
      type: string
      description: |-
        * `light` - Light
        * `dark` - Dark
        * `auto` - Auto
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        user_id:
          type: string
          readOnly: true
          nullable: true
          description: 半角英数字とアンダースコアのみ使用可能
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_staff:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: スーパーユーザー権限
          description: 全ての権限を持っているとみなされます。
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        organization_name:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - is_staff
      - is_superuser
      - last_login
      - organization_name
      - role
      - user_id
    UserSettings:
      type: object
      properties:
        daily_study_goal_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        study_reminders_enabled:
          type: boolean
        reminder_time:
          type: string
          format: time
        theme_preference:
          $ref: '#/components/schemas/ThemePreferenceEnum'
        notification_settings: {}
    UserSubject:
      type: object
      description: 利用者が選んだ科目（I494。GET・PUT /api/user/subjects/ の応答）
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        problem_count:
          type: integer
          readOnly: true
          description: 科目の問題数（0 の科目ではクイズを始められない）
      required:
      - id
      - name
      - problem_count
    UserSubjectSelection:
      type: object
      description: 学ぶ科目の置き換えの本文（I494）。自組織の科目だけを受ける
      properties:
        subject_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 200
          minItems: 1
      required:
      - subject_ids
    WebAuthnCredential:
      type: object
      description: ブラウザの PublicKeyCredential.toJSON() の結果（中身の検証は py_webauthn に任せる・I619）
      properties:
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: {}
      required:
      - challenge_id
      - credential
    WebAuthnOptions:
      type: object
      description: WebAuthn の options と、検証のときに送り返す challenge の番号（I619）
      properties:
        challenge_id:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: {}
      required:
      - challenge_id
      - options
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
